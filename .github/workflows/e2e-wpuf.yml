name: Playwright tests/e2e


on:
  workflow_dispatch:
    inputs:
      testsuite:
        description: 'Test suite to run'
        required: true
        default: 'E2E'
        type: choice
        options:
          - 'E2E'
      pro_repo:
        description: 'wpuf-pro repository to test against'
        required: false
        default: 'weDevsOfficial/wpuf-pro'
        type: string
      pro_ref:
        description: 'wpuf-pro ref (branch/tag/sha) to test against'
        required: false
        default: 'develop'
        type: string
  schedule:
    # 1:00 AM Bangladesh Time
    - cron: '0 19 * * 0'
  push:
    branches: ['develop']
  pull_request:
    branches: ['develop']

# Least-privilege token: the workflow only reads the repo (private wpuf-pro is
# cloned with a dedicated ACCESS_TOKEN secret, not GITHUB_TOKEN).
permissions:
  contents: read

# Coalesce runs so overlapping suites never mutate a shared wp-env at once.
# Only PR runs auto-cancel a superseded run (new push to the same PR); manual
# dispatches and branch/schedule runs get a unique group (run_id) so they run to
# completion instead of cancelling each other.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Feature-grouped shards: each job runs a set of RELATED spec files (its own
  # wp-env + the setup project runs first within the shard). Grouping keeps a
  # feature's files together on one runner (post-* together, reg-* together) so
  # any intra-feature ordering/state stays intact — no cross-shard dependency.
  # workers:1 keeps files serial within a shard, so admin sessions never collide.
  e2e:
    name: e2e (${{ matrix.group }})
    if: github.repository != 'weDevsOfficial/wp-user-frontend' && github.repository != 'weDevsOfficial/wpuf-pro'
    timeout-minutes: 120
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: post
            files: tests/postFormTest.spec.ts tests/postFormSettingsTest.spec.ts
          - group: registration
            files: tests/regFormTestPro.spec.ts tests/regFormSettingsTestPro.spec.ts tests/frontendLoginTest.spec.ts tests/mailpoetRegistrationTestPro.spec.ts
          - group: fields-subscription
            files: tests/fieldOptionSettingsTest.spec.ts tests/subscriptionTest.spec.ts tests/aiFormBuilderTest.spec.ts tests/releaseSmokeTest.spec.ts
          # The React admin app screens (lists, Submissions page, builder "+",
          # settings, welcome) and the Pro QR field: their own runner so the
          # other groups do not get slower as the app tests grow.
          - group: admin-app
            files: tests/adminAppTest.spec.ts tests/settingsScreenTest.spec.ts tests/welcomeTest.spec.ts tests/postFormDefaultsTest.spec.ts tests/qrCodeFieldTestPro.spec.ts tests/moduleScreensTest.spec.ts
          # Onboarding reruns the setup wizard (pages, settings): alone, so it
          # cannot change what another group's specs expect.
          - group: onboarding
            files: tests/onboardingTest.spec.ts

    steps:
      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: wp-cli

      # Checkout WP-User-Frontend repo
      - name: Checkout testing repo
        id: clone-wp-user-frontend
        uses: actions/checkout@v4

      # Use desired version of NodeJS
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # pnpm builds git-hosted packages inside its store; a store under a
      # node_modules path makes wp-scripts' `exclude: /node_modules/` skip their
      # sources (FlyHR e2e.yml). Keep the store elsewhere.
      - name: Move the pnpm store off a node_modules path
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Use desired version of NodeJS
        uses: actions/setup-node@v4
        with:
            node-version-file: .nvmrc
            cache: pnpm
            cache-dependency-path: |
              pnpm-lock.yaml
              tests/e2e/pnpm-lock.yaml

      # Clone wpuf-pro
      - name: Clone wpuf-pro
        id: clone-wpuf-pro
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.pro_repo || 'weDevsOfficial/wpuf-pro' }}
          token: ${{ secrets.ACCESS_TOKEN }}
          path: plugins/wpuf-pro
          ref: ${{ github.event.inputs.pro_ref || 'develop' }}

      # Build wpuf-pro
      - name: Build WPUF-pro
        working-directory: plugins/wpuf-pro
        run: |
          composer i --no-dev -o
          npm i --legacy-peer-deps
          # Pro's React bundles are webpack builds, gitignored and built here. Pro's
          # webpack resolves shared packages (@wordpress/hooks, @tannin/*) out of
          # lite's node_modules, exactly like the pro release workflow, so put lite
          # where those paths resolve (sibling at plugins/wp-user-frontend) and
          # install its deps before the build. (A Pro ref from before the React
          # admin still runs its old vite build here.)
          ln -sfn "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/plugins/wp-user-frontend"
          ( cd "$GITHUB_WORKSPACE" && pnpm install --frozen-lockfile )
          npm run build
          npx grunt --force
          # Drop the self-referencing symlink now that vite is done. Leaving it
          # makes the workspace contain itself; lite's later `grunt` makepot
          # recursively scans PHP files, follows the cycle, and exhausts the
          # runner (~14 min hang, then SIGTERM/exit 143). wp-env maps lite from
          # the repo root directly, so nothing after this needs the symlink.
          rm -f "$GITHUB_WORKSPACE/plugins/wp-user-frontend"

      # The default grunt build ships no appsero_key.php, so wpuf-pro falls back
      # to the dev product hash (958afc63) and the AppSumo license key — issued
      # against the AppSumo product hash — fails to activate (LS0005). Pin the
      # AppSumo hash so the licensed setup step can activate WPUF_PRO_LICENSE_KEY.
      - name: Pin WPUF-pro Appsero product hash for licensed e2e
        run: echo '<?php return "4561d782-e4c2-42f8-9eb4-d1eec7c2effb";' > plugins/wpuf-pro/includes/appsero_key.php

       # Build wp-user-frontend
      - name: Build wpuf-lite
        run: |
          composer i --no-dev -o
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec grunt release --force
          pnpm exec grunt --force

      # Install test dependencies with performance optimizations
      - name: Install test dependencies
        working-directory: tests/e2e
        run: |
            pnpm install --frozen-lockfile

      - name: Install Plugins
        working-directory: plugins/
        run: |

              # Download and extract WP Mail Log
              wget https://downloads.wordpress.org/plugin/wp-mail-log.latest-stable.zip
              unzip wp-mail-log.latest-stable.zip
              rm wp-mail-log.latest-stable.zip

              # Download and extract WooCommerce
              wget https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip
              unzip woocommerce.latest-stable.zip
              rm woocommerce.latest-stable.zip

              # Download and extract Easy Digital Downloads
              wget https://downloads.wordpress.org/plugin/easy-digital-downloads.latest-stable.zip
              unzip easy-digital-downloads.latest-stable.zip
              rm easy-digital-downloads.latest-stable.zip

              # Download and extract WC Vendors
              wget https://downloads.wordpress.org/plugin/wc-vendors.latest-stable.zip
              unzip wc-vendors.latest-stable.zip
              rm wc-vendors.latest-stable.zip

              # Download and extract WC Multivendor Membership
              wget https://downloads.wordpress.org/plugin/wc-multivendor-membership.latest-stable.zip
              unzip wc-multivendor-membership.latest-stable.zip
              rm wc-multivendor-membership.latest-stable.zip

              # Download and extract Dokan
              wget https://downloads.wordpress.org/plugin/dokan-lite.latest-stable.zip
              unzip dokan-lite.latest-stable.zip
              rm dokan-lite.latest-stable.zip

              # Download and extract MailPoet (email-marketing subscribe-on-registration tests)
              wget https://downloads.wordpress.org/plugin/mailpoet.latest-stable.zip
              unzip mailpoet.latest-stable.zip
              rm mailpoet.latest-stable.zip

              # # Download and extract The Events Calendar
              # wget https://downloads.wordpress.org/plugin/the-events-calendar.latest-stable.zip
              # unzip the-events-calendar.latest-stable.zip
              # rm the-events-calendar.latest-stable.zip

      # Start wordpress environment
      - name: Start WordPress Env and Show URL
        id: wp-env
        if: success()
        uses: nick-fields/retry@v3
        with:
            timeout_minutes: 4
            max_attempts: 2
            retry_on: error
            command: |
              cd tests/e2e
              npx wp-env start

      # Cache browser binaries, cache key is based on Playwright version and OS
      - name: Cache playwright binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
            path: |
                ~/.cache/ms-playwright
            key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
            restore-keys: |
                ${{ runner.os }}-playwright-

      # setup-php adds the ondrej/php PPA; its InRelease Label later changed, so
      # apt-get update fails (exit 100) and 'playwright install --with-deps' dies.
      # Acknowledge the label change before installing browser OS dependencies.
      - name: Refresh apt sources (ondrej PPA label changed)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update --allow-releaseinfo-change

      # Install browser binaries & OS dependencies if cache missed
      - name: Install Playwright browser binaries & OS dependencies
        id: pw-install
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests/e2e
        run: |
            npx playwright install chromium --with-deps

      # Run Playwright tests/e2e for this shard
      - name: 🧪 Run e2e tests (${{ matrix.group }})
        env:
          CI: true
          E2E_GROUP: ${{ matrix.group }}
          # Test environment variables
          BASE_URL: ${{ secrets.QA_BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.QA_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
          WPUF_PRO_LICENSE_KEY: ${{ secrets.WPUF_PRO_LICENSE_KEY }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GOOGLE_MAP_API_KEY: ${{ secrets.GOOGLE_MAP_API_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}
        if: success() && (github.event_name != 'workflow_dispatch' || ( github.event_name == 'workflow_dispatch' && (github.event.inputs.testsuite == 'E2E' || github.event.inputs.testsuite == 'All')))
        working-directory: tests/e2e
        run: |
          mkdir -p test-results
          # Site reset/config first, then ONLY this group's spec files — that is
          # the whole point of the matrix. `test:all:ci` here made every job run
          # the full suite (3x the work, past the 120-min budget with workers:1).
          pnpm run test:setup:ci
          npx playwright test --config=playwright.config.ts --project=e2e ${{ matrix.files }}
          # REST layer is browserless and quick; run it once, in the post group.
          if [ "${{ matrix.group }}" = "post" ]; then pnpm run test:api:ci; fi
        # continue-on-error: true

      # Upload this shard's blob report so the merge job can combine all shards
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.group }}
          path: tests/e2e/blob-report
          retention-days: 1

  # Combine every shard's blob report into one HTML report and send the run status.
  merge-reports:
    if: always() && github.repository != 'weDevsOfficial/wp-user-frontend' && github.repository != 'weDevsOfficial/wpuf-pro'
    needs: [e2e]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout testing repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # pnpm builds git-hosted packages inside its store; a store under a
      # node_modules path makes wp-scripts' `exclude: /node_modules/` skip their
      # sources (FlyHR e2e.yml). Keep the store elsewhere.
      - name: Move the pnpm store off a node_modules path
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Use desired version of NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: tests/e2e/pnpm-lock.yaml

      - name: Install test dependencies
        working-directory: tests/e2e
        run: pnpm install --frozen-lockfile

      # Download every shard's blob report into one folder
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: tests/e2e/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        working-directory: tests/e2e
        run: pnpm run merge-reports

      # Post a pass/fail table to the run's Summary tab (restores the visible
      # sharded summary that used to be generated per-parallel-config).
      - name: Write run summary
        if: always()
        working-directory: tests/e2e
        run: |
          npx playwright merge-reports --reporter json ./all-blob-reports > merged-results.json 2>/dev/null || true
          node -e '
            const fs = require("fs");
            let d;
            try { d = JSON.parse(fs.readFileSync("merged-results.json", "utf8")); } catch (e) { process.exit(0); }
            const s = { passed: 0, failed: 0, flaky: 0, skipped: 0 };
            const failed = [];
            const walkSpecs = (specs = []) => specs.forEach((sp) => (sp.tests || []).forEach((t) => {
              if (t.status === "expected") s.passed++;
              else if (t.status === "unexpected") { s.failed++; failed.push(sp.title); }
              else if (t.status === "flaky") s.flaky++;
              else if (t.status === "skipped") s.skipped++;
            }));
            const walk = (suites = []) => suites.forEach((su) => { walkSpecs(su.specs); walk(su.suites); });
            walk(d.suites);
            const total = s.passed + s.failed + s.flaky + s.skipped;
            let md = "## 🧪 E2E Test Summary\n\n";
            md += "| Total | ✅ Passed | ❌ Failed | ⚠️ Flaky | ⏭️ Skipped |\n";
            md += "|---|---|---|---|---|\n";
            md += `| ${total} | ${s.passed} | ${s.failed} | ${s.flaky} | ${s.skipped} |\n`;
            if (failed.length) { md += "\n### ❌ Failed tests\n" + failed.map((t) => "- " + t).join("\n") + "\n"; }
            if (process.env.GITHUB_STEP_SUMMARY) { fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md); }
          '

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 3

      # Fail the run if any shard failed, so the workflow status reflects the tests.
      - name: Reflect shard results in run status
        if: needs.e2e.result != 'success'
        run: |
          echo "One or more e2e shards did not pass (result: ${{ needs.e2e.result }})."
          exit 1

      # Send Email Report if passed
      # Notification only — never fail the pipeline if SMTP is unavailable
      # (e.g. a fork without SMTP_EMAIL_* secrets). The run status already
      # reflects the tests via "Reflect shard results in run status".
      - name: Send Test Report on email (Passed)
        if: success()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_EMAIL_USERNAME }}
          password: ${{ secrets.SMTP_EMAIL_PASSWORD }}
          subject: ${{ github.job }} job of ${{ github.repository }} has ${{ job.status }}
          body: |
            ${{ github.job }} job in workflow ${{ github.workflow }} of ${{ github.repository }} has ${{ job.status }}.

            Test was conducted on WPUF plugin.

            To View full test run, click on the following link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: rubaiyat.mohammad@wedevs.com, anik@wedevs.com
          from: wedevs.testing1@gmail.com

      # Send Email Report if failed
      # Notification only — never fail the pipeline if SMTP is unavailable.
      - name: Send Test Report on email (Failed)
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_EMAIL_USERNAME }}
          password: ${{ secrets.SMTP_EMAIL_PASSWORD }}
          subject: ${{ github.job }} job of ${{ github.repository }} has ${{ job.status }}
          body: |
            ${{ github.job }} job in workflow ${{ github.workflow }} of ${{ github.repository }} has ${{ job.status }}.

            Test was conducted on WPUF plugin.

            To View full test run, click on the following link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: rubaiyat.mohammad@wedevs.com
          from: wedevs.testing1@gmail.com
