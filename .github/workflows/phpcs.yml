on: pull_request

name: Inspections
jobs:
  runPHPCSInspection:
    name: Run PHPCS inspection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer, cs2pr

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Setup cache
        uses: pat-s/always-upload-cache@v1.1.4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-suggest --no-progress

      # Every page of the PR file list (the API returns 30 per page by default),
      # PHP files only, and never removed files: phpcs stops on a missing path.
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | .filename | select(endswith(".php"))' > changed-php.txt
          echo "count=$(grep -c . changed-php.txt || true)" >> $GITHUB_OUTPUT

      - name: Detect coding standard violations
        if: steps.changes.outputs.count != '0'
        run: vendor/bin/phpcs --file-list=changed-php.txt -q --report=checkstyle | cs2pr --graceful-warnings
