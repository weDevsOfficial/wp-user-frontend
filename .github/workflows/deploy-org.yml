name: Deploy to WordPress.org
# 10up-based release pipeline (replaces the Appsero auto-deploy).
# Pushing a tag (vX.Y.Z) builds the assets in CI, publishes a GitHub Release
# with the packaged zip, then deploys to the wp.org SVN repo via 10up.
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  tag:
    name: Deploy plugin for new Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # pnpm builds git-hosted packages inside its store; a store under a
      # node_modules path makes wp-scripts' `exclude: /node_modules/` skip their
      # sources (FlyHR e2e.yml). Keep the store elsewhere.
      - name: Move the pnpm store off a node_modules path
        run: pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Use desired version of PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          # bin/make-pot.mjs (grunt i18n) extracts the POT with WP-CLI.
          tools: wp-cli

      # `pnpm build` ends with bin/verify-build.mjs, so a half-built bundle fails here.
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # The POT (bin/make-pot.mjs, WP-CLI set up with PHP above). Everything else
      # was built once by `pnpm build`; nothing is rebuilt after this point.
      - name: POT
        run: pnpm run i18n

      - name: Composer install (no dev)
        run: composer install --no-dev --optimize-autoloader

      # Generated assets are gitignored and built fresh here; the 10up deploy ships
      # them from the working tree. Hard gate: if any build output is missing the
      # package would ship broken (the failure mode this whole model guards against).
      - name: Verify built assets exist on disk
        run: node bin/verify-build.mjs --release

      # Distributable zip, the same file set the deploy below ships (.distignore).
      # bin/zip.mjs checks tag = WPUF_VERSION = header = Stable tag, then the
      # unpacked zip: one folder, every generated asset, no sources / dev files /
      # maps, every PHP file lints. Written outside the working tree so neither
      # the zip nor the notes can reach SVN.
      - name: Generate and check the plugin zip
        run: node bin/zip.mjs --out "$RUNNER_TEMP/release" --skip-verify --keep-vendor

      - name: Extract changelog
        run: |
          { echo "## Changelog"; echo ""; \
            awk '/^= v?[0-9]/{n++; if(n>1) exit} n>=1{print}' readme.txt; } > "$RUNNER_TEMP/release/RELEASE_NOTES.md"
          echo "---- release notes ----"; cat "$RUNNER_TEMP/release/RELEASE_NOTES.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ${{ runner.temp }}/release/wp-user-frontend-v*.zip
          body_path: ${{ runner.temp }}/release/RELEASE_NOTES.md

      # wp.org SVN deploy last — the zip/Release above survive a deploy retry.
      # NO BUILD_DIR: the default 10up flow rsyncs the working tree (with the
      # freshly built, gitignored assets) to SVN, applying .distignore.
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: false
        env:
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASS }}
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SLUG: wp-user-frontend
